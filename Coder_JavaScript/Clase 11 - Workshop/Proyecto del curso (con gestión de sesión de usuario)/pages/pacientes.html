<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de Pacientes</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-4bw+/aepP/YC94hEpVNVgiZdgIC5+VKNBQNGCHeKRQN+PtmoHDEXuppvnDJzQIu9"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css"
    />
    <link rel="stylesheet" href="./../styles/pacientes.css" />
  </head>
  <body>
    <div class="container">
      <!-- Menu de navegación -->
      <nav
        class="navbar bg-dark navbar-expand-lg bg-body-tertiary"
        data-bs-theme="dark"
      >
        <div class="container-fluid">
          <a class="navbar-brand" href="#">Clase 11</a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a class="nav-link" aria-current="page" href="./../index.html"
                  >Inicio</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link active" href="./pacientes.html"
                  >Registrar Paciente</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link" href="./turnos.html">Registrar Turno</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>

      <h1>Gestión de Pacientes</h1>

      <div id="datosUnPaciente"></div>

      <div id="errorsMessages" class="hide" role="alert"></div>

      <!-- Formulario -->
      <form id="formulario" class="needs-validation" novalidate>
        <div class="mb-3">
          <label
            id="labelNumeroDocumento"
            for="numeroDocumento"
            class="form-label"
            >Documento de identidad</label
          >
          <input
            type="text"
            class="form-control"
            id="numeroDocumento"
            placeholder="Número de documento"
          />
        </div>

        <div class="mb-3">
          <label for="apellidos" class="form-label">Apellidos</label>
          <input
            type="text"
            class="form-control"
            id="apellidos"
            placeholder="Apellidos"
          />
        </div>

        <div class="mb-3">
          <label for="nombres" class="form-label">Nombres</label>
          <input
            type="text"
            class="form-control"
            id="nombres"
            placeholder="Nombres"
          />
        </div>

        <div class="mb-3">
          <label for="fechaNacimiento" class="form-label"
            >Fecha de nacimiento</label
          >
          <input type="date" class="form-control" id="fechaNacimiento" />
        </div>

        <div class="mb-3">
          <label for="obraSocial" class="form-label">Obra social</label>
          <select id="obraSocial" class="form-select">
            <option value="">Seleccione una Obra social</option>
            <option value="1">OSDE</option>
            <option value="2">Sancor Salud</option>
            <option value="3">Swiss médical</option>
            <option value="4">SmaUNaM</option>
          </select>
        </div>

        <div class="mb-3">
          <label for="numeroAfiliado" class="form-label"
            >Número de afiliado</label
          >
          <input
            type="text"
            class="form-control"
            id="numeroAfiliado"
            placeholder="Número de afiliado"
          />
        </div>

        <div class="mb-3">
          <label for="correoElectronico" class="form-label"
            >Correo electrónico</label
          >
          <input
            type="email"
            class="form-control"
            id="correoElectronico"
            placeholder="Correo electrónico"
          />
        </div>

        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
          <button class="btn btn-outline-secondary me-1" type="reset">
            Limpiar
          </button>
          <button type="submit" class="btn btn-success" id="btnRegistrar">
            Registrar
          </button>
        </div>
      </form>

      <!-- Ejemplo de datos recuperados desde una API -->
      <hr />
      <h3 class="mt-3">Pacientes registrados:</h3>

      <!-- Buscador -->
      <form class="d-flex" role="search" id="searchForm">
        <button id="clearSearchForm" class="btn btn-outline-secondary me-1" type="reset">
          Limpiar
        </button>
        <input
          id="searchText"
          class="form-control me-2"
          type="search"
          placeholder="Ingrese el nombre completo o parcial de un paciente para generar un listado"
          aria-label="Filtrar"
        />
        <button class="btn btn-outline-success" type="submit">Filtrar</button>
      </form>

      <!-- Identificar carga -->
      <div
        id="loadingMessage"
        class="d-flex align-items-center alert alert-info mt-3 visually-hidden"
      >
        <strong>Recuperando datos...</strong>
        <div
          class="spinner-border ms-auto"
          role="status"
          aria-hidden="true"
        ></div>
      </div>

      <table class="table table-striped">
        <thead class="text-center">
          <tr>
            <th scope="col">N° de Documento</th>
            <th scope="col">Apellidos</th>
            <th scope="col">Nombres</th>
            <th scope="col">Obra social</th>
            <th scope="col">N° de Afiliado</th>
            <th scope="col">Correo electrónico</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>

    <!-- Código Javascript insertado a través de un fichero que puede ser local o externo, como aquellos que provienen de librerías (lo veremos en la clase de hoy y en adelante) -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-HwwvtgBNo3bZJJLYd8oVXjrBZt8cqVSpeBNS5n7C8IVInixGAoxmnlMuBnhbgrkm"
      crossorigin="anonymous"
    ></script>
    <script src="./../scripts/mainMensajes.js"></script>
    <script src="./../mocks/obrasSociales.js"></script>
    <script src="./../classes/obraSocial.js"></script>
    <script src="./../scripts/mainObraSocial.js"></script>
    <script src="./../mocks/pacientes.js"></script>
    <script src="./../classes/paciente.js"></script>
    <script src="./../scripts/utils.js"></script>
    <script src="./../scripts/mainPacientes.js"></script>
  </body>
</html>
