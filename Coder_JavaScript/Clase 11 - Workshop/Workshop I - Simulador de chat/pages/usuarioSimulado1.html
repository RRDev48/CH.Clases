    <!-- Ejemplo de etiquetas que pueden ser vista con facilidad por el usuario en la pantalla del navegador. -->
    <div class="container">
      <h1>Simulador de Mensajería - Usuario simulado 1</h1>

      <!-- Columnas para indicar los nombres de los usuarios -->
      <div class="row mb-2">
        <div class="col">
          <div class="row">
            <div class="col">
              <form class="d-flex" role="search" id="messageFormUsser">
                <input
                  id="usserName"
                  class="form-control"
                  type="text"
                  placeholder="Nombre de usuario 1"
                />
                <button class="btn btn-outline-secondary m-1" type="submit">
                  Establecer
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>

      <!-- Columnas para ingresar mensajes de los usuarios -->
      <div class="row mb-2">
        <div class="col">
          <form role="search" id="bodyMessageFormUser">
            <label for="messageUsser">Ingrese mensaje del usuario 1:</label>
            <textarea
              id="messageUsser"
              class="form-control"
              type="textarea"
              placeholder="Mensaje del usuario"
              rows="4"
            ></textarea>
            <div class="float-right">
              <button class="btn btn-outline-secondary m-1" type="submit">
                Enviar
              </button>
            </div>
          </form>
        </div>
      </div>

      <hr />

      <div id="messageBodyContainer" class="row">
        <!-- Formulario para establecer el nombre del usuario -->
        
      </div>
