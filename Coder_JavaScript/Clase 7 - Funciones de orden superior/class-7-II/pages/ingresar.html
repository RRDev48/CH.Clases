<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clase 8: Funciones de Orden Superior II</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-4bw+/aepP/YC94hEpVNVgiZdgIC5+VKNBQNGCHeKRQN+PtmoHDEXuppvnDJzQIu9"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./../styles/ingresar.css" />
  </head>
  <body class="text-center">
    <!-- Ejemplo de etiquetas que pueden ser vista con facilidad por el usuario en la pantalla del navegador. -->
    <form class="form-signin">
      <img
        class="mb-4"
        src="./../assets/images/logo.png"
        alt=""
        width="72"
        height="72"
      />
      <h1 class="h3 mb-3 font-weight-normal">¡Completa tus credenciales!</h1>
      <label for="nombreUsuario" class="sr-only">Nombre de usuario</label>
      <input
        type="text"
        id="nombreUsuario"
        class="form-control"
        placeholder="Nombre de Usuario"
        autofocus="true"
      />
      <label for="contrasena" class="sr-only">Contraseña</label>
      <input
        type="password"
        id="contrasena"
        class="form-control"
        placeholder="Contraseña"
      />
      <button class="btn btn-lg btn-primary btn-block" type="submit">
        Ingresar
      </button>
      <p class="mt-5 mb-3 text-muted">© 2023</p>
    </form>

    <!-- Código Javascript insertado a través de un fichero que puede ser local o externo, como aquellos que provienen de librerías (lo veremos en la clase de hoy y en adelante) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-HwwvtgBNo3bZJJLYd8oVXjrBZt8cqVSpeBNS5n7C8IVInixGAoxmnlMuBnhbgrkm" crossorigin="anonymous"></script>
  </body>
</html>
