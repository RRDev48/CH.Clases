<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>After Class V</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-4bw+/aepP/YC94hEpVNVgiZdgIC5+VKNBQNGCHeKRQN+PtmoHDEXuppvnDJzQIu9"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css"
    />
  </head>
  <body>
    <!-- Ejemplo de etiquetas que pueden ser vista con facilidad por el usuario en la pantalla del navegador. -->
    <div class="container">
      <h1>Hola Bienvenidos al último after class</h1>

      <!-- Ejemplo de datos recuperados desde una API -->
      <hr />
      <h3 class="mt-3">Pacientes registrados:</h3>

      <!-- Buscador -->
      <form class="d-flex" role="search" id="searchForm">
        <button class="btn btn-outline-secondary me-1" type="reset">
          Limpiar
        </button>
        <div class="mb-3">
          <label for="autorsSelectable" class="form-label">Autores</label>
          <select id="autorsSelectable" class="form-select">
            <option value="">Seleccione un Autor</option>
          </select>
        </div>
        <button class="btn btn-outline-success" type="submit">Aplicar</button>
      </form>

      <!-- Identificar carga -->
      <div
        id="loadingMessage"
        class="d-flex align-items-center alert alert-info mt-3 visually-hidden"
      >
        <strong>Recuperando datos...</strong>
        <div
          class="spinner-border ms-auto"
          role="status"
          aria-hidden="true"
        ></div>
      </div>

      <div id="bodyContent"></div>
    </div>

    <!-- Código Javascript insertado a través de un fichero que puede ser local o externo, como aquellos que provienen de librerías (lo veremos en la clase de hoy y en adelante) -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script
      type="text/javascript"
      src="https://cdn.jsdelivr.net/npm/toastify-js"
    ></script>
    <script src="./scripts/main.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-HwwvtgBNo3bZJJLYd8oVXjrBZt8cqVSpeBNS5n7C8IVInixGAoxmnlMuBnhbgrkm"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
