<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>registrar un Usuario</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-4bw+/aepP/YC94hEpVNVgiZdgIC5+VKNBQNGCHeKRQN+PtmoHDEXuppvnDJzQIu9"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./../styles/ingresar.css" />
  </head>
  <body class="text-center">
    <!-- Ejemplo de etiquetas que pueden ser vista con facilidad por el usuario en la pantalla del navegador. -->
    <form id="registerFormUser" class="form-signin">
      <h3>Formulario de registro para un nuevo usuario</h3>
      <!-- Registrar nombre de usuario -->
      <div class="mb-3">
        <label id="labelNombreUsuario1" for="nombreUsuario" class="form-label"
          >Nombre de usuario</label
        >
        <input
          type="text"
          class="form-control"
          id="nombreUsuario"
          placeholder="Nombre de usuario"
        />
      </div>

      <div class="mb-3">
        <label
          id="labelNombreUsuario2"
          for="repetirNombreUsuario"
          class="form-label"
          >Repetir nombre de usuario</label
        >
        <input
          type="text"
          class="form-control"
          id="repetirNombreUsuario"
          placeholder="Repetir nombre de usuario"
        />
      </div>

      <!-- Registrar contraseña -->
      <div class="mb-3">
        <label
          id="labelContrasenaUsuario1"
          for="contrasenaUsuario"
          class="form-label"
          >Contraseña de usuario</label
        >
        <input
          type="text"
          class="form-control"
          id="contrasenaUsuario"
          placeholder="Contraseña del usuario"
        />
      </div>
      <div class="mb-3">
        <label
          id="labelContrasenaUsuario2"
          for="repetirContrasena"
          class="form-label"
          >Repetir contraseña</label
        >
        <input
          type="text"
          class="form-control"
          id="repetirContrasena"
          placeholder="Repetir contraseña"
        />
      </div>

      <div
        class="d-grid gap-2 d-md-flex justify-content-md-end"
        style="margin-bottom: 10px"
      >
        <button class="btn btn-outline-secondary me-1" type="reset">
          Limpiar
        </button>
        <button type="submit" class="btn btn-success" id="btnRegistrar">
          Registrar
        </button>
      </div>
      <a href="./ingresar.html">Ya tengo una cuenta!</a>
    </form>

    <!-- Código Javascript insertado a través de un fichero que puede ser local o externo, como aquellos que provienen de librerías (lo veremos en la clase de hoy y en adelante) -->
    <script src="./../classes/usuario.js"></script>
    <script src="./../constants/index.js"></script>
    <script src="./../scripts/mainRegistrarUsuario.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-HwwvtgBNo3bZJJLYd8oVXjrBZt8cqVSpeBNS5n7C8IVInixGAoxmnlMuBnhbgrkm"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
