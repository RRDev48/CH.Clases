<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilos.css"> <!--Vincula el CSS-->
    <title>Formulario con Netlify</title>
</head>
<body>
    <form method="post" name="miformulario" netlify>
        <h2>Contacto</h2>
        <input type="text" name="Nombre" placeholder="Ingresa tu nombre">
        <input type="text" name="Apellido" placeholder="Ingresa tu apellido">
        <input type="email" name="Correo" placeholder="Ingresa tu correo">
        <input type="number" name="Telefono" placeholder="Ingresa tu telefono">
        <textarea name="Comentarios" id="Comentarios" cols="30" rows="7" placeholder="Escribe tus comentarios"></textarea>
        <input type="submit" name="Registrate gratis" id="Enviar">
    </form>
</body>
</html>
