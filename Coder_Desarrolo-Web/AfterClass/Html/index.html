<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>inicio</title>
</head>
<body>
    <h1>mi titulo</h1>
    <!--Etiqueta br hace salto de linea-->
    <strong>Negrita</strong> <br> <!--Importa por el SEO-->
    <em>Cursiva</em> <!--Importa por el SEO-->

    <!--Etiqueta hr hace salto de linea y crea una barra divisora-->
    <b>Negrita</b><hr> <!--No importa por el SEO-->
    <i>Cursiva</i> <!--No importa por el SEO-->

    <!--Direction = left, right, top, bottom-->
    <!--Behavior = Scroll, alternate, slide-->
    <marquee behavior="" direction="">Corre wachin🏃 👾</marquee>

    <div></div>


    <!--Etiquetas semanticas-->
    <header></header>
    <nav></nav>
    <aside></aside>
    <main></main>
    <section></section>
    <article></article>
    <footer></footer>
</body>
</html>
